name: Bootstrap (run once)

# One-time setup: installs dependencies at versions matched to the Expo SDK,
# downloads the word list, runs the tests, and commits the lockfile and word list.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Align packages with the Expo SDK
        working-directory: apps/mobile
        run: npx expo install --fix
      - name: Refresh lockfile
        run: npm install
      - name: Download word list
        run: npm run words
      - name: Test
        run: npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/mobile/package.json packages/engine/data apps/mobile/assets/words.txt functions/data
          git diff --cached --quiet || git commit -m "Bootstrap: lockfile and word list"
          git push
