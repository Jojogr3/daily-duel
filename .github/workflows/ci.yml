name: CI

# Every push and pull request: run all tests, typecheck everything, and make sure the app bundles.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Engine and backend tests
        run: npm test 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Bundle the app (web export)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist 2>&1 | tee -a ../../ci.log; exit ${PIPESTATUS[0]}
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Build backend
        run: npm run build -w functions 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Report failure
        if: failure()
        # Annotations are readable without downloading logs. Group lines to fit GitHub's per-step limit.
        run: |
          grep -E "error|Error|ERR!|failed|not ok|TS[0-9]{4}" ci.log | grep -v "^\s*$" | tail -80 > errs.txt || true
          split -l 8 errs.txt chunk_
          for c in chunk_*; do [ -f "$c" ] && echo "::error title=CI failure::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$c")"; done
      - name: Expo doctor
        working-directory: apps/mobile
        run: npx expo-doctor
        continue-on-error: true
      - name: Upload web build (playable preview)
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: apps/mobile/dist
          retention-days: 7
