name: Set backend secrets

# Copies server secrets from GitHub into Firebase's Secret Manager. Run once, and again
# whenever a value changes. Anything not provided is set to "unset" (feature off) so deploys work.
on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Set secrets
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          PUZZLE_SALT: ${{ secrets.PUZZLE_SALT }}
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          set_secret () {
            printf '%s' "$2" | npx --yes firebase-tools@latest functions:secrets:set "$1" --project "$PROJECT" --data-file - --force --non-interactive
          }
          # The salt keeps future puzzles unguessable. If none is given, generate one (only do this once!).
          if [ -z "$PUZZLE_SALT" ]; then
            if npx --yes firebase-tools@latest functions:secrets:access PUZZLE_SALT --project "$PROJECT" >/dev/null 2>&1; then
              echo "PUZZLE_SALT already set; keeping it."
            else
              set_secret PUZZLE_SALT "$(openssl rand -hex 32)"
            fi
          else
            set_secret PUZZLE_SALT "$PUZZLE_SALT"
          fi
          set_secret REVENUECAT_WEBHOOK_AUTH "${REVENUECAT_WEBHOOK_AUTH:-unset}"
          set_secret REVENUECAT_API_KEY "${REVENUECAT_API_KEY:-unset}"
